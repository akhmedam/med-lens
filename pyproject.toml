[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "med-lens"
version = "0.0.1"
description = "Biomedical literature search and cited research drafts over PubMed."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi==0.162.5", "uvicorn==0.54.0"]
test-api = ["httpx==0.28.1"]
reranking = ["torch==2.14.1", "transformers==5.20.1"]
embeddings = ["torch==2.14.1", "transformers==5.20.1", "numpy==2.4.6"]
tokenization = ["transformers==5.20.1"]
retrieval = ["bm25s==0.3.14", "numpy==2.4.6"]
inference = [
    "torch==2.14.1",
    "transformers==5.20.1",
    "accelerate==1.15.0",
    "kernels==0.17.2",
    "psutil==7.2.2",
]

[project.scripts]
medlens-api = "medlens.api_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"medlens.evaluation" = ["annotation.html", "biomedical_annotation.html"]
