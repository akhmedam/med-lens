[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "med-lens"
version = "0.0.1"
description = "Retrieval experiments over PubMed literature on depression and anxiety."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
retrieval = ["bm25s==0.3.14", "numpy==2.4.6"]
inference = [
    "torch==2.14.1",
    "transformers==5.20.1",
    "accelerate==1.15.0",
    "kernels==0.17.2",
    "psutil==7.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"medlens.evaluation" = ["annotation.html"]
