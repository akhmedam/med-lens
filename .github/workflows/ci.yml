name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Offline tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install application and development dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-build-isolation -e .
          python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Offline regression suite
        run: python -m unittest discover -s tests -v
      - name: Build source and wheel distributions
        run: python -m build --no-isolation
      - name: Verify installed wheel outside the checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -I - <<'PY'
          from importlib.resources import files
          import medlens

          assert "site-packages" in medlens.__file__, medlens.__file__
          for name in ("annotation.html", "biomedical_annotation.html", "confirmation_annotation.html"):
              assert (files("medlens.evaluation") / name).is_file(), name
          PY
          medlens --help
          medlens-api --help
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
